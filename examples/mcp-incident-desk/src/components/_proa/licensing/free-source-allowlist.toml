    "LICENSE",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "LICENSING.md",
    "THIRD_PARTY_NOTICES.md",
    "licensing/free-source-allowlist.toml",
]

# This list must exactly match ComponentTier::Free in catalog_source.
# Every file recursively below each listed directory is eligible for a Free
# source-install payload.
