# Ephemeral pull-request runners. Keep this pool separate from `gcp-ci`: PR
# build scripts execute repository code and must not inherit the Workload
# Identity that can write trusted-main sccache objects. This pool's identity
# can only read that bucket, so pull requests start from main's warm compiler
# cache without being able to poison it.
githubConfigUrl: https://github.com/Proa-Labs/proa
githubConfigSecret: proa-github-token
controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc-systems
runnerScaleSetName: gcp-pr-ci
minRunners: 0
maxRunners: 8
template:
  spec:
    # `pr-runner` is bound to the read-only GSA `proa-ci-sccache-ro`, which
    # holds nothing but roles/storage.objectViewer on gs://proa-ci-sccache.
    # Never replace it with the `runner` KSA used by the trusted
    # cache-writing pool.
    serviceAccountName: pr-runner
    nodeSelector:
      ci-runner-pool: "true"
    tolerations:
      - key: ci-runner-pool
        operator: Equal
        value: "true"
        effect: NoSchedule
    containers:
      - name: runner
        image: us-west1-docker.pkg.dev/airy-cycle-504821-k9/ci-images/proa-runner:1.95.0-v6
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "7"
            memory: "26Gi"
            ephemeral-storage: "80Gi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
    volumes:
      - name: work
        emptyDir: {}
