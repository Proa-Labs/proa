# Shared source files that may be copied with Free components. Mixed crate
# entry points, metadata exporters, email/mobile modules, and central component
# catalogs remain deliberately absent.
shared_support_files = [
    "proa_ui/src/anatomy.rs",
    "proa_ui/src/collection.rs",
    "proa_ui/src/component_macros.rs",
    "proa_ui/src/component_tree.rs",
    "proa_ui/src/components/md_support.rs",
    "proa_ui/src/form.rs",
    "proa_ui/src/free_web.rs",
    "proa_ui/src/overlay.rs",
    "proa_ui/src/recipe.rs",
    "proa_ui/src/slots.rs",
    "proa_ui/src/state.rs",
    "proa_ui/src/theme.rs",
    "proa_ui/src/tokens.rs",
    "proa_ui/src/traits.rs",
    "proa_ui/src/variant_spec.rs",
    "proa_ui/runtime/proa-free.css",
    "proa_ui/runtime/proa-free.js",
]

shared_support_directories = []

# Immediate component directories that exist in source but are not entries in
# the marketing availability catalog. They remain outside Free payloads until
# explicitly classified in that catalog.
known_non_catalog_component_directories = [
    "link",
    "script",
]

# Reviewed cross-component dependency closure for selective installs. A
# component not listed here has no dependency on another component directory.
[component_dependencies]
alert_dialog = ["dialog"]
button = ["spinner"]
dialog = ["button"]

