<svg xmlns="http://www.w3.org/2000/svg" width="980" height="615" viewBox="0 0 980 615" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Proa, React, Marko and Go html/template serving the canonical pages over HTTP on one core</title>
<desc id="dsc">One core per engine, uncompressed loopback HTTP/1.1. Medians of three fresh processes; CPU counts all server threads. Proa on the Component page: 89,403 responses per second, 0.011 ms CPU per response, 8.2 MiB peak RSS. React on the Component page: 9,116 responses per second, 0.116 ms CPU per response, 241.3 MiB peak RSS. Marko on the Component page: 40,294 responses per second, 0.026 ms CPU per response, 228.3 MiB peak RSS. Go html/template on the Component page: 7,267 responses per second, 0.138 ms CPU per response, 19.2 MiB peak RSS. Proa on the Product grid: 18,247 responses per second, 0.055 ms CPU per response, 9.5 MiB peak RSS. React on the Product grid: 1,686 responses per second, 0.608 ms CPU per response, 315.9 MiB peak RSS. Marko on the Product grid: 4,692 responses per second, 0.232 ms CPU per response, 380.0 MiB peak RSS. Go html/template on the Product grid: 1,079 responses per second, 0.932 ms CPU per response, 18.8 MiB peak RSS. Proa on the 1,000-row table: 3,130 responses per second, 0.320 ms CPU per response, 66.5 MiB peak RSS. React on the 1,000-row table: 219 responses per second, 4.770 ms CPU per response, 486.9 MiB peak RSS. Marko on the 1,000-row table: 727 responses per second, 1.416 ms CPU per response, 315.1 MiB peak RSS. Go html/template on the 1,000-row table: 85 responses per second, 11.852 ms CPU per response, 22.5 MiB peak RSS.</desc>
