# cargo-deny configuration. Consumed by `cargo deny check ...`,
# wired into .github/workflows/cargo-audit.yml as part of the dependency
# security gate.
#
# To accept a specific advisory or duplicate, add it to the relevant
# `ignore` array below with a comment naming the finding and the
# reason. Do not loosen severity globally.

[advisories]
version = 2
yanked = "deny"
# Accepted informational advisories (unmaintained/unsound, no fixed
# release). Mirrors .cargo/audit.toml, which carries the full
# dependency-path justification per entry. All accepted.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained with no fixed release; used by syntect to deserialize its trusted embedded syntax pack at docs build time, never untrusted input" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix unmaintained; enters only via indicatif in the proa-cli developer tool, not shipped library code" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies without a version requirement are
# fine for local-only crates. Publishable dependencies carry matching
# version requirements. External wildcards remain denied.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []

[licenses]
version = 2
confidence-threshold = 0.93
# Local-only workspace packages are checked by the archive/license guard.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Boost Software License, OSI-approved permissive. Sole license of
    # xxhash-rust. Added explicitly.
    "BSL-1.0",
    # Community Data License Agreement Permissive 2.0, the license of
    # the Mozilla root CA data shipped by webpki-roots (rustls TLS
    # stack). Added explicitly.
    "CDLA-Permissive-2.0",
]
