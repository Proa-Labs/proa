[env]
# aws-lc-sys 0.42 does not discover the macOS SDK when CC points directly at
# Xcode's internal clang. Use the SDK-aware system driver for this target while
# leaving the developer's general CC/CXX selection untouched.
AWS_LC_SYS_TARGET_CC_aarch64_apple_darwin = { value = "/usr/bin/cc", force = false }
AWS_LC_SYS_TARGET_CXX_aarch64_apple_darwin = { value = "/usr/bin/c++", force = false }

# In-repo alias for the Proa developer CLI: `cargo proa lint`, `cargo proa
# fmt --verify`, `cargo proa chunks <paths>`. The package name is `proa-cli`
# (hyphenated), which is why `-p proa_cli` does not resolve.
[alias]
proa = "run --quiet --release -p proa-cli --bin proa --"
