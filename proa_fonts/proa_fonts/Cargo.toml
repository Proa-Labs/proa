[package]
name = "proa_fonts"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Self-hosted, metric-matched web fonts for Proa: zero-JS <head> rendering over a build-time vendoring pipeline."
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["render", "macros"]
# Build collectors and proc macros only need font descriptors and request IDs.
render = ["dep:proa_core"]
macros = ["dep:proa_fonts_macros"]

[dependencies]
proa_fonts_types = { workspace = true }
proa_fonts_macros = { workspace = true, optional = true }
proa_core = { workspace = true, optional = true }

[[test]]
name = "base_path_alloc"
required-features = ["render"]

[lints]
workspace = true
