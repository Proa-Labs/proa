name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR validation supersedes stale runs. Main runs have independent CI gates;
  # only release builds cancel one another, and production cutovers serialize.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-image:
    name: Build release image
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-image-main
      cancel-in-progress: true
    # This workflow reference is the one permitted on the trusted runner
    # group. PR code never gets its Cloud Build identity or production cache.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 65
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@01af06c41d9aa0790d6fdc8f0b982b768ca4d102
        with:
          project_id: airy-cycle-504821-k9
      - name: Install pinned registry copy tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory="$RUNNER_TEMP/proa-crane"
          mkdir -p "$directory"
          archive="$directory/crane.tar.gz"
          gh release download v0.22.1 --repo google/go-containerregistry \
            --pattern go-containerregistry_Linux_x86_64.tar.gz --output "$archive"
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$directory" crane
          echo "$directory" >> "$GITHUB_PATH"
      - name: Compile and verify the release image
        id: build
        env:
          GHCR_PUSH_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: python3 deploy/marketing/release.py build

  deploy-release:
    name: Deploy verified image to Railway
    concurrency:
      group: railway-production
      cancel-in-progress: false
    needs: [ci, release-image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Reject a superseded revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
      - name: Deploy the exact image that passed validation
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RELEASE_IMAGE: ${{ needs.release-image.outputs.image }}
          RAILWAY_SERVICE_ID: 8a6d0a70-bfd2-4e6e-bf87-048c563a7044
          RAILWAY_ENVIRONMENT_ID: 9348508f-a2a4-48bb-b18b-803ccb33dd9a
          RAILWAY_READY_URL: https://proa.so/readyz
        run: python3 deploy/marketing/release.py deploy

  marketing-tests:
    name: Marketing linked tests
    runs-on: ${{ github.event_name == 'pull_request' && 'gcp-pr-ci' || vars.CI_RUNNER }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Analytics policy tests execute their browser code in Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          check-latest: true
      - name: Test marketing with its linked island manifest
        run: |
          cargo run --locked -p proa-cli --bin proa -- \
            test --root . --locked -p proa_marketing --bin proa_marketing
      - name: Test browser documentation tools
        run: node --test proa_marketing/tests-js/agent-tools.test.mjs
      - name: Test JavaScript documentation SDK and CLI
        run: node --test sdk/javascript/test/*.test.mjs
      - name: Install Python documentation SDK tooling
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.11"
          enable-cache: false
      - name: Check Python documentation SDK and CLI
        working-directory: sdk/python
        run: |
          uv run --locked pytest
          uv run --locked ruff check
          uv run --locked ruff format --check
          uv run --locked ty check src
          uv build --out-dir "$RUNNER_TEMP/proa-docs-dist"

  workflow-lint:
    name: GitHub Actions syntax and shell safety
    # Hosted Actions are unavailable when the organization spending limit is
    # blocked. Keep PR lint on the untrusted pool and trusted events on the
    # configured runner instead of making CI depend on account billing state.
    runs-on: ${{ github.event_name == 'pull_request' && 'gcp-pr-ci' || vars.CI_RUNNER }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Lint workflows and embedded shell
        uses: ./.github/actions/workflow-lint

  changes:
    # The linked acceptance shards build proa-cli, the RSJS pipeline, and the
    # example applications. A pull request that touches only documentation,
    # marketing, or deployment content cannot change what they build or
    # assert, so it skips them. Anything unclassifiable runs them.
    name: Changed paths
    runs-on: ${{ github.event_name == 'pull_request' && 'gcp-pr-ci' || vars.CI_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      linked: ${{ steps.classify.outputs.linked }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Decide whether the linked acceptance suite applies
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/linked_acceptance_paths.py

  rust:
    name: Rust lint and tests
    # Pull-request code can execute arbitrary build.rs logic. Keep it off the
    # GCP runner identity that can write the cache consumed by trusted main
    # deployment jobs; only main/workflow_dispatch uses the private runner.
    # Fail closed: untrusted PR code must never fall through to CI_RUNNER when
    # a repository variable is absent or misspelled.
    runs-on: ${{ github.event_name == 'pull_request' && 'gcp-pr-ci' || vars.CI_RUNNER }}
    timeout-minutes: 45
    env:
      # Incremental artifacts are not reusable through sccache. CI starts from
      # an empty target directory and benefits more from cacheable codegen.
      CARGO_INCREMENTAL: "0"
      # Debug info made the proa-cli test/wrapper executables disproportionately
      # large and expensive to link, snapshot, and fingerprint in CI.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Keep the server alive until the explicit stats step. Its default
      # ten-minute idle timeout previously made the final report look empty.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run Rust validation
        uses: ./.github/actions/rust-ci
        with:
          cache-backend: ${{ github.event_name == 'pull_request' && 'gha' || startsWith(vars.CI_RUNNER, 'gcp') && 'gcs' || 'gha' }}

  windows-cross-check:
    name: Windows build-engine cross-check
    # This pure-Rust graph needs no Windows linker. Run it independently so
    # cfg(windows) coverage does not extend the main Rust validation job.
    runs-on: ${{ github.event_name == 'pull_request' && 'gcp-pr-ci' || vars.CI_RUNNER }}
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check Windows build-engine compilation
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --locked -p proa_build --lib --target x86_64-pc-windows-msvc

  linked-acceptance:
    name: Linked acceptance (${{ matrix.mode }})
    needs: changes
    # Documentation-only pull requests skip the suite; the ci gate below
    # accepts the skip only when this same output says so.
    if: needs.changes.outputs.linked != 'false'
    runs-on: ${{ github.event_name == 'pull_request' && 'gcp-pr-ci' || vars.CI_RUNNER }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Every linked `proa test` invocation is a cold descriptor plus final
        # build of a few hundred crates and shares nothing with the next one,
        # so the work is cut along invocation boundaries. PRs run one job,
        # `pr`, whose script runs the helper acceptance suite and each example
        # concurrently on the same runner: one visible check instead of three.
        # The trusted GCP fleet fans main's proa-cli targets out four ways and
        # gives the examples a fifth shard; the single-runner VPS rollback
        # path gets one complete suite. Keeping every event in one matrix
        # avoids a visible skipped job.
        mode: ${{ fromJSON(github.event_name == 'pull_request' && '["pr"]' || startsWith(vars.CI_RUNNER, 'gcp') && '["main-5","main-1","main-2","main-3","main-4"]' || '["main-all"]') }}
    env:
      # cargo-proa rejects RUSTC_WRAPPER by design: descriptor/final cache
      # identity and compilation side effects must never be bypassed by a
      # compiler cache. These jobs therefore start without sccache configured.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run linked acceptance
        uses: ./.github/actions/linked-acceptance
        with:
          mode: ${{ matrix.mode }}

  deployment-tests:
    name: Deployment tooling tests
    runs-on: ${{ github.event_name == 'pull_request' && 'gcp-pr-ci' || vars.CI_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Test deployment tooling
        uses: ./.github/actions/deployment-tests

  ci:
    # Preserve the existing required-check name while the expensive suites run
    # independently. Any non-success result in a dependency fails this gate.
    name: lint, clippy, build, test
    if: always()
    needs:
      - workflow-lint
      - changes
      - rust
      - windows-cross-check
      - linked-acceptance
      - deployment-tests
      - marketing-tests
    # Use the existing pools for the aggregate gate as well: GitHub-hosted
    # runners may be unavailable independently of repository correctness.
    runs-on: ${{ github.event_name == 'pull_request' && 'gcp-pr-ci' || vars.CI_RUNNER }}
    timeout-minutes: 2
    steps:
      - name: Require every applicable CI job
        env:
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          WINDOWS_CROSS_CHECK_RESULT: ${{ needs.windows-cross-check.result }}
          LINKED_ACCEPTANCE_RESULT: ${{ needs.linked-acceptance.result }}
          LINKED_ACCEPTANCE_SKIPPABLE: ${{ needs.changes.outputs.linked == 'false' }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-tests.result }}
          MARKETING_RESULT: ${{ needs.marketing-tests.result }}
        run: |
          # A skipped linked suite passes only when the changed-paths job
          # decided the pull request did not need it; any other skip or
          # cancellation fails the gate like a failure would.
          if [[ "$LINKED_ACCEPTANCE_RESULT" == "skipped" && "$LINKED_ACCEPTANCE_SKIPPABLE" == "true" ]]; then
            echo "linked acceptance skipped: the pull request changes only documentation, marketing, or deployment content"
            LINKED_ACCEPTANCE_RESULT=success
          fi
          for result in \
            "$WORKFLOW_LINT_RESULT" \
            "$CHANGES_RESULT" \
            "$RUST_RESULT" \
            "$WINDOWS_CROSS_CHECK_RESULT" \
            "$LINKED_ACCEPTANCE_RESULT" \
            "$DEPLOYMENT_RESULT" \
            "$MARKETING_RESULT"
          do
            case "$result" in
              success) ;;
              *)
                echo "required CI dependency finished with result: $result" >&2
                exit 1
                ;;
            esac
          done
