# cargo-deny configuration. Consumed by `cargo deny check ...`,
# wired into .github/workflows/cargo-audit.yml as part of the dependency
# security gate.
#
# To accept a specific advisory or duplicate, add it to the relevant
# `ignore` array below with a comment naming the finding and the
# reason. Do not loosen severity globally.

[advisories]
version = 2
yanked = "deny"
# Accepted informational advisories (unmaintained/unsound, no fixed
# release). Mirrors .cargo/audit.toml, which carries the full
# dependency-path justification per entry. All accepted.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained with no fixed release; used by syntect to deserialize its trusted embedded syntax pack at docs build time, never untrusted input" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix unmaintained; enters only via indicatif in the proa-cli developer tool, not shipped library code" },
    { id = "RUSTSEC-2026-0097", reason = "rand unsound only with a custom logger re-entering rand::rng(); no fixed release; paths are SQLx optional drivers, proptest dev-dependency, and reqwest/quinn transitive" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies without a version requirement are
# fine: these crates publish only to the private registry, and the path is
# the source of truth. External wildcards remain denied.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    # Proa private registry, named "proa" in .cargo/config.toml. The
    # sparse+ URL must match the configured index exactly.
    "sparse+https://registry.proa.so/sparse/",
]
allow-git = []

[licenses]
version = 2
confidence-threshold = 0.93
# Workspace crates are first-party Apache-2.0 packages and currently publish
# only to the "proa" registry ([workspace.package] publish = ["proa"] in the
# root Cargo.toml). Skip dependency-license checks for our own packages; their
# inherited license-file metadata and packaged LICENSE are validated
# separately. The allow list below still applies to every external dependency.
private = { ignore = true, registries = ["proa"] }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Boost Software License, OSI-approved permissive. Sole license of
    # xxhash-rust. Added explicitly.
    "BSL-1.0",
    # Community Data License Agreement Permissive 2.0, the license of
    # the Mozilla root CA data shipped by webpki-roots (rustls TLS
    # stack). Added explicitly.
    "CDLA-Permissive-2.0",
]
