<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="title description">
  <title id="title">A registered route renders a Page component</title>
  <desc id="description">The content.rs module defines ContentPage with ROLE set to PAGE. A handler registered at the slash URL renders that component. The file name alone does not create a route.</desc>
  <style>
.canvas {fill:#faf8f4}.panel {fill:#fffdf9;stroke:#dcd5cb;stroke-width:1.4}.ink {fill:#302c27}.muted {fill:#80776d}.line {stroke:#bdb3a6;stroke-width:1.5;fill:none}.layout {fill:#f5eee2;stroke:#b69a72;stroke-width:1.6}.page {fill:#fff0e5;stroke:#d6804d;stroke-width:1.8}.component {fill:#eef3ed;stroke:#8aab8c;stroke-width:1.4}.tag {font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}.h {font:600 19px ui-sans-serif,system-ui,sans-serif}.body {font:14px ui-sans-serif,system-ui,sans-serif}.mono {font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.small {font:12px ui-sans-serif,system-ui,sans-serif}.arrow-head {fill:#a99b8b}
@media(prefers-color-scheme:dark){.canvas{fill:#202020}.panel{fill:#272624;stroke:#5d574f}.ink{fill:#ece6dc}.muted{fill:#c0b7aa}.layout{fill:#383024;stroke:#b69a72}.page{fill:#442e23;stroke:#e29663}.component{fill:#26382b;stroke:#8aab8c}.line{stroke:#8c8172}}
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" class="arrow-head" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="410" rx="18" class="canvas" />
  <text x="28" y="39" class="h ink">A page is a component with ROLE = PAGE</text>
  <rect x="28" y="65" width="348" height="280" rx="12" class="panel" />
  <text x="48" y="96" class="body muted">Rust modules</text>
  <text x="53" y="135" class="mono ink">src/</text>
  <text x="53" y="164" class="mono ink">  pages/</text>
  <text x="53" y="193" class="mono ink">    content.rs</text>
  <rect x="47" y="211" width="310" height="106" rx="9" class="page" />
  <rect x="61" y="225" width="70" height="25" rx="7" class="page" />
  <text x="96.0" y="242" class="tag ink" text-anchor="middle">PAGE</text>
  <text x="61" y="274" class="mono ink">ContentPage { title, message }</text>
  <text x="61" y="298" class="mono muted">const ROLE = ComponentRole::PAGE</text>
  <path d="M393 211H464" class="line" marker-end="url(#arrow)" />
  <text x="428" y="194" class="small muted" text-anchor="middle">render</text>
  <rect x="480" y="65" width="452" height="280" rx="12" class="panel" />
  <text x="500" y="96" class="mono muted">Registered route: GET /</text>
  <rect x="500" y="115" width="412" height="208" rx="12" class="page" />
  <rect x="518" y="132" width="70" height="25" rx="7" class="page" />
  <text x="553.0" y="149" class="tag ink" text-anchor="middle">PAGE</text>
  <text x="518" y="206" class="h ink">Home</text>
  <text x="518" y="235" class="body muted">Welcome to Acme.</text>
  <text x="518" y="296" class="mono muted">&lt;main data-content-page&gt;</text>
  <text x="28" y="379" class="body muted">Register the URL explicitly; Rust module names organize the source code.</text>
</svg>