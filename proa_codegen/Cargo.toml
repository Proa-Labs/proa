[package]
name = "proa_codegen"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
publish.workspace = true
description = "Product-neutral React and TypeScript generation from Proa component metadata."
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "proa_codegen"
path = "src/lib.rs"

[[bin]]
name = "proa-codegen"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
