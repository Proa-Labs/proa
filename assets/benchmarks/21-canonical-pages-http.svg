  .tick{ font-size: 10.5px; font-weight: 400; fill: #898781; font-variant-numeric: tabular-nums; }
  .val { font-size: 11px; font-weight: 500; fill: #52514e; font-variant-numeric: tabular-nums;
         paint-order: stroke; stroke: #fcfcfb; stroke-width: 3.5px; stroke-linejoin: round; }
  .valb{ font-size: 11px; font-weight: 600; fill: #0b0b0b; font-variant-numeric: tabular-nums;
         paint-order: stroke; stroke: #fcfcfb; stroke-width: 3.5px; stroke-linejoin: round; }
  .valw{ font-size: 11px; font-weight: 600; fill: #fcfcfb; font-variant-numeric: tabular-nums; }
  .note{ font-size: 10px; font-weight: 400; fill: #898781; }
  .mono{ font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
