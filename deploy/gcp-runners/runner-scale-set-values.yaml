# gha-runner-scale-set values for the Proa CI fleet on GKE (Standard mode,
# Granite Rapids spot node pool with local SSD ephemeral storage). The
# scale-set name IS the runs-on label: CI_RUNNER=gcp-ci routes ci.yml here.
# Register at organization scope so GitHub enforces the workflow restriction
# on proa-trusted-main.
githubConfigUrl: https://github.com/Proa-Labs
githubConfigSecret: proa-github-token
runnerGroup: proa-trusted-main
controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc-systems
runnerScaleSetName: gcp-ci
minRunners: 0
maxRunners: 8
template:
  spec:
    serviceAccountName: runner
    nodeSelector:
      ci-runner-pool: "true"
      # Pins runners to the `runners-c4` pool (c4-standard-16-lssd spot,
      # Granite Rapids). Drop this line to fall back to the legacy
      # n2d-standard-8 `runners` pool, which carries the same taint.
      ci-runner-family: "c4"
    tolerations:
      - key: ci-runner-pool
        operator: Equal
        value: "true"
        effect: NoSchedule
    containers:
      - name: runner
        image: us-west1-docker.pkg.dev/airy-cycle-504821-k9/ci-images/proa-runner:1.95.0-v6
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            # One runner per c4-standard-16-lssd node: 16 vCPU / 60 GB,
            # of which GKE leaves about 15.9 CPU and 53 GiB allocatable.
            cpu: "15"
            memory: "48Gi"
            # emptyDir below lands on the node's local NVMe SSD
            # (--ephemeral-storage-local-ssd), so the work dir gets
            # NVMe latency with zero persistent-disk quota cost.
            ephemeral-storage: "80Gi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
    volumes:
      - name: work
        emptyDir: {}
