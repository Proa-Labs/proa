<title id="ttl">Server-render latency relative to Proa — November 11, 2026 canonical capture</title>
<desc id="dsc">Renderer-only latency, excluding HTTP and hydration. Proa returns fresh owned RenderBuffer pages without String conversion; peers retain their owned String outputs. Each dot is the median of five process P50s on a logarithmic axis. All cells passed DOM parity. 17 renderers across three workloads as a multiple of Proa's P50. Proa — Component page: 880 ns, 1×; 1,000-row table: 190 µs, 1×; Product grid: 11 µs, 1×. Marko — Component page: 7.67 µs, 8.76×; 1,000-row table: 950 µs, 5.02×; Product grid: 88 µs, 8.38×. React — Component page: 72.7 µs, 83×; 1,000-row table: 3.64 ms, 19.2×; Product grid: 400 µs, 38.5×. Vue — Component page: 7.08 µs, 8.09×; 1,000-row table: 1.15 ms, 6.07×; Product grid: 83 µs, 7.93×. Svelte — Component page: 8.21 µs, 9.38×; 1,000-row table: 950 µs, 4.99×; Product grid: 70 µs, 6.71×. Rails — Component page: 59 µs, 67.4×; 1,000-row table: 6.09 ms, 32.2×; Product grid: 410 µs, 38.7×. jte — Component page: 8.46 µs, 9.67×; 1,000-row table: 1.98 ms, 10.4×; Product grid: 230 µs, 21.9×. Rocker — Component page: 16 µs, 18.2×; 1,000-row table: 2.59 ms, 13.7×; Product grid: 360 µs, 34.6×. Handlebars — Component page: 19.3 µs, 22.1×; 1,000-row table: 2.31 ms, 12.2×; Product grid: 200 µs, 19.4×. Go html/template — Component page: 86.3 µs, 98.6×; 1,000-row table: 8.61 ms, 45.5×; Product grid: 670 µs, 63.5×. Jinja2 — Component page: 94.8 µs, 108×; 1,000-row table: 15.2 ms, 80.1×; Product grid: 1.3 ms, 124×. PHP — Component page: 34 µs, 38.9×; 1,000-row table: 1.39 ms, 7.36×; Product grid: 85 µs, 8.05×. Askama — Component page: 1.54 µs, 1.76×; 1,000-row table: 600 µs, 3.15×; Product grid: 22 µs, 2.14×. Sailfish — Component page: 2.33 µs, 2.67×; 1,000-row table: 540 µs, 2.85×; Product grid: 25 µs, 2.35×. Leptos — Component page: 21.5 µs, 24.6×; 1,000-row table: 1.84 ms, 9.74×; Product grid: 220 µs, 20.6×. Dioxus — Component page: 105 µs, 120×; 1,000-row table: 2.27 ms, 12×; Product grid: 310 µs, 29.2×. Topcoat — Component page: 12.1 µs, 13.9×; 1,0