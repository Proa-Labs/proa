# The cache is an explicit archive, including source mtimes and both RSJS
# targets. Docker layer cache exporters alone do not persist RUN cache mounts.
steps:
  - id: restore
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update -qq && apt-get install -y -qq zstd
        if metadata=$$(gcloud storage objects describe '${_CACHE}/cache.tar.zst' 2>&1); then
          gcloud storage cp '${_CACHE}/cache.tar.zst' /cache/cache.tar.zst
          tar --zstd -xf /cache/cache.tar.zst -C /cache
          rm /cache/cache.tar.zst
        elif [[ "$$metadata" != *'404'* && "$$metadata" != *'not found'* && "$$metadata" != *'matched no objects'* ]]; then
          printf '%s\n' "$$metadata" >&2
          exit 1
        fi
    volumes: [{name: cache, path: /cache}]

  - id: compile
    name: rust:1.95.0-slim-bookworm@sha256:d7482085ff5b415f84dba5647ae71606650bdef00db7aeb69f4b3d170c3e4082
    entrypoint: bash
    args:
      - -ceu
      - |
        bash deploy/marketing/install-tools.sh
        python3 deploy/marketing/build.py --units '${_UNITS}' --lto '${_LTO}'
    volumes: [{name: cache, path: /cache}, {name: release, path: /release}]

  - id: save
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update -qq && apt-get install -y -qq zstd
        tar --format=posix --pax-option=delete=atime,delete=ctime -I 'zstd -T0 -1' \
          -cf /release/cache.tar.zst -C /cache source target cargo
        gcloud storage cp /release/cache.tar.zst '${_CACHE}/cache.tar.zst'
        gcloud storage cp --recursive /release/report '${_CACHE}/reports/$BUILD_ID/'
        cp -a /release/artifacts /workspace/release-artifacts
    volumes: [{name: cache, path: /cache}, {name: release, path: /release}]

  - id: package
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    args: [build, --build-arg, BUILD_ARTIFACTS=prebuilt, -f, proa_marketing/Dockerfile, -t, '${_IMAGE}:${_REVISION}', .]

  - id: smoke
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run -d --name proa-release --network cloudbuild -e PORT=5000 '${_IMAGE}:${_REVISION}'
        trap 'docker logs proa-release; docker rm -f proa-release' EXIT
        docker run --rm --network cloudbuild -v /workspace:/work -w /work \
          node:22-bookworm-slim node deploy/marketing/smoke.mjs http://proa-release:5000
        docker run --rm --network cloudbuild -v /workspace:/work -w /work \
          mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48 \
          bash -ceu 'npm install --ignore-scripts --no-audit --no-fund --prefix /tmp/pw playwright@1.61.1; \
            PLAYWRIGHT_MODULE=file:///tmp/pw/node_modules/playwright/index.mjs \
            node deploy/marketing/browser-smoke.mjs http://proa-release:5000'

images: ['${_IMAGE}:${_REVISION}']
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: us-west1-docker.pkg.dev/airy-cycle-504821-k9/releases/proa-marketing
  _REVISION: manual
  _CACHE: gs://airy-cycle-504821-k9-marketing-cache/release-v2-descriptor0-cgu16-thin
  _UNITS: '16'
  _LTO: thin
