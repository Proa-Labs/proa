[package]
name = "proa_macros"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
publish.workspace = true
description = "Compile-time HTML, Markdown, component, and island macros for Proa."
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[features]
default = ["markdown"]
markdown = ["proa_dsl/markdown"]
no-perf-hints = ["proa_dsl/no-perf-hints"]

[dependencies]
proa_dsl = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true, features = ["full", "parsing", "extra-traits", "visit"] }

# Note: proa_ir is NOT a proc-macro dependency - the derive macro
# generates code that references it, which is resolved in the user's crate

[dev-dependencies]
# Forward development dependencies stay local during the first crates.io release.
# Cargo omits path-only dev dependencies from archives; workspace tests retain them.
proa_actions = { path = "../proa_actions" }
proa_core = { workspace = true }
proa_ir = { path = "../proa_ir" }
proa_react = { path = "../proa_react" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
trybuild = { workspace = true }

[[test]]
name = "markdown_arguments"
required-features = ["markdown"]

[[test]]
name = "markdown_escaping"
required-features = ["markdown"]

[[test]]
name = "md_tests"
required-features = ["markdown"]

[[test]]
name = "md_compile_fail"
required-features = ["markdown"]

[[test]]
name = "render_slots"
required-features = ["markdown"]

[[test]]
name = "content_markers"
required-features = ["markdown"]

[[test]]
name = "content_coverage"
required-features = ["markdown"]
