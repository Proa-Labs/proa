[package]
name = "mcp-incident-desk"
default-run = "mcp-incident-desk"
publish = false
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
proa = { workspace = true, features = ["axum", "actions", "rt-tokio"] }
anyhow = "1"
axum.workspace = true
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde_json = { version = "1" }
http = "1"
base64 = "0.23.1"
sha2 = "0.11.1"
subtle = "2"
rand = "0.10.4"
rsa = { version = "0.10", features = ["getrandom"] }
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
argon2 = "0.6.0"
url = { version = "2.5.9", features = ["serde"] }
urlencoding = "2"
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
rustls = "0.23.46"
reqwest = { version = "0.13", features = ["json", "form", "cookies"] }
rmcp = { workspace = true, features = ["base64", "macros", "client", "server", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-io", "reqwest"] }
schemars = "1"
tiktoken-rs = "0.12.1"
const_format = { version = "0.2" }
heapless.workspace = true

[dev-dependencies]
pulldown-cmark = { workspace = true, features = ["html"] }
regex = "1"
tempfile = "3"

[lints]
workspace = true
