[package]
name = "rsjs_ir"
version = "0.2.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Side-table IR for the rsjs reactive island compiler: identifier types, constrained Expr, reactive declarations, JS emitter, and optimisation passes. Layered on top of a lifted html! parse tree from proa_macros."
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Foundational: rsjs islands lower to proa server components, and the
# emitted Rust references proa's rendering-trait contracts. The IR
# itself doesn't carry syn types, so this dep stays light.
proa_core = { workspace = true }
rsjs_web = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
