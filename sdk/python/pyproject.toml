[project]
name = "proa-docs"
version = "0.1.1"
description = "Official Proa Rust framework documentation SDK and CLI"
readme = "README.md"
authors = [
    { name = "Proa Labs, Inc." }
]
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["proa", "rust", "documentation", "sdk", "cli", "agents", "mcp"]

[project.urls]
Homepage = "https://proa.so"
Documentation = "https://proa.so/docs/api"
Repository = "https://github.com/Proa-Labs/proa"
Issues = "https://github.com/Proa-Labs/proa/issues"

[project.scripts]
proa-docs = "proa_docs.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.11"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.93",
]
