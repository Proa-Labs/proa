[package]
name = "proa_webmcp_pizza"
version = "0.1.0"
edition.workspace = true
publish = false
rust-version.workspace = true
license-file.workspace = true
description = "End-to-end Proa, Wellformed, RSJS, and WebMCP pizza-order demo"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
proa_core = { workspace = true }
proa_macros = { workspace = true }
rsjs = { workspace = true }
rsjs_macros = { workspace = true }
serde = { workspace = true }
wellformed = "0.1.1"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
wellformed-macros = { version = "0.1.0" }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
