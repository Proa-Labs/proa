[package]
name = "proa_fonts_build"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Build-time font pipeline for Proa: vendor woff2, compute metric-matched fallbacks, and generate proa_fonts modules."
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["fetch"]
# Fetch Google-sourced declarations from the collector. Without it, only
# local_font! declarations resolve; google_font! needs `run_with_resolver`.
fetch = ["dep:reqwest"]

[dependencies]
brotli = { workspace = true }
byteorder = { workspace = true }
proa_fonts = { workspace = true }
proa_fonts_parse = { workspace = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
serde = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
thiserror = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
