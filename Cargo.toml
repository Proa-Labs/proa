[workspace]
members = [
    "proa_core",
    "proa_cli",
    "proa_dsl",
    "proa_macros",
    "proa_stream",
    "proa_docs/proa_docs",
    "proa_docs/proa_docs_build",
    "proa_react",
    "proa_framework/proa_framework_core",
    "proa_framework/proa_framework_axum",
    "proa_marketing",
    "proa_codegen",
    "proa_ir",
    "proa_fonts/proa_fonts",
    "proa_fonts/proa_fonts_build",
    "proa_fonts/proa_fonts_parse",
    "proa_fonts/proa_fonts_macros",
    "proa_actions",
    "const_json/const_json",
    "const_json/const_json_macros",
    "tailwind-merge/tailwind-merge",
    "tailwind-merge/tailwind-merge-macro",
    "proa_bench",
    "proa_demo",
    "proa_showcase",
    "proa_showcase_web",
    "proa_og",
    "proa_third_party",
    "itoa_lut",
    "rsjs",
    "rsjs_ir",
    "rsjs_macros",
    "rsjs_transport",
    "rsjs_web",
    "proa_demo/bench/lean-page/proa-server",
    "examples/webmcp-pizza",
    "examples/origin-routing-atlas",
    "examples/mcp-incident-desk",
]
default-members = [
    "proa_core",
    "proa_cli",
    "proa_dsl",
    "proa_macros",
    "proa_stream",
    "proa_framework/proa_framework_core",
    "proa_framework/proa_framework_axum",
    "proa_ir",
    "proa_actions",
    "proa_codegen",
    "rsjs",
    "rsjs_ir",
    "rsjs_macros",
    "rsjs_transport",
    "rsjs_web",
]
resolver = "2"

[workspace.package]
edition = "2021"
publish = ["crates-io"]
rust-version = "1.93.0"
description = "Proa server-rendering framework workspace crate"
# Cargo resolves inherited license-file paths relative to the workspace root
# and includes the file in every package archive.
license-file = "LICENSE"
repository = "https://github.com/proa-labs/proa"
homepage = "https://proa.so"

[workspace.dependencies]
anyhow = { version = "1" }
arrayvec = { version = "0.7", default-features = false }
axum = { version = "0.7.9" }
base64 = { version = "0.22.1" }
brotli = { version = "8" }
byteorder = { version = "1.5.0" }
bytes = { version = "1" }
chrono = { version = "0.4.38", features = ["clock", "serde"] }
const_json_macros = { package = "proa_const_json_macros", path = "const_json/const_json_macros", version = "0.1.2" }
criterion = { version = "0.5", default-features = false }
dashmap = { version = "6.1.0", features = ["serde"] }
futures = { version = "0.3.29" }
heapless = { version = "0.8", default-features = false }
http = { version = "1.3.1" }
http-body-util = { version = "0.1" }
hyper = { version = "1" }
itoa_lut = { path = "itoa_lut", version = "0.1.2" }
libc = { version = "0.2" }
linkme = { version = "0.3" }
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }
pretty_assertions = { version = "1.4.1" }
proa_actions = { path = "proa_actions", version = "0.3.0" }
proa_bench = { path = "proa_bench", version = "0.1.0" }
proa_core = { path = "proa_core", version = "0.3.0" }
proa_demo = { path = "proa_demo", version = "0.1.0" }
proa_docs = { path = "proa_docs/proa_docs", version = "0.2.0" }
proa_docs_build = { path = "proa_docs/proa_docs_build", version = "0.2.0" }
proa_dsl = { path = "proa_dsl", version = "0.1.3" }
proa_fonts = { path = "proa_fonts/proa_fonts", version = "0.1.0" }
proa_fonts_build = { path = "proa_fonts/proa_fonts_build", version = "0.1.0" }
proa_fonts_macros = { path = "proa_fonts/proa_fonts_macros", version = "0.1.0" }
proa_fonts_parse = { path = "proa_fonts/proa_fonts_parse", version = "0.1.0" }
proa_framework_axum = { path = "proa_framework/proa_framework_axum", version = "0.3.0" }
proa_framework_core = { path = "proa_framework/proa_framework_core", version = "0.3.0" }
proa_ir = { path = "proa_ir", version = "0.1.2" }
proa_macros = { path = "proa_macros", version = "0.3.0" }
proa_react = { path = "proa_react", version = "0.3.0" }
proa_showcase = { path = "proa_showcase", version = "0.2.1", default-features = false }
proa_showcase_web = { path = "proa_showcase_web", version = "0.1.0" }
proa_stream = { path = "proa_stream", version = "0.3.0", default-features = false }
proa_third_party = { path = "proa_third_party", version = "0.1.0", default-features = false }
proc-macro2 = { version = "1" }
pulldown-cmark = { version = "0.13", default-features = false }
quote = { version = "1.0.37" }
rand = { version = "0.9.2" }
regex = { version = "1.12.2" }
# cargo-proa is relocated into a content-addressed wrapper snapshot. Keep its
# HTTP client independent of host OpenSSL SONAMEs so the strict snapshot
# dependency contract remains valid on Linux builders.
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "cookies", "http2", "rustls-tls-native-roots", "system-proxy"] }
rsjs = { path = "rsjs", version = "0.2.0" }
rsjs_ir = { path = "rsjs_ir", version = "0.2.0" }
rsjs_macros = { path = "rsjs_macros", version = "0.2.0" }
rsjs_transport = { path = "rsjs_transport", version = "0.1.0" }
rsjs_web = { path = "rsjs_web", version = "0.2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
# The `asm` feature is not portable to generic AArch64 targets with the
# pinned Rust toolchain: sha2 0.10 emits SHA-2/SHA-3 instructions that the
# assembler correctly rejects unless the whole target guarantees them. The
# default backend still runtime-dispatches to SHA extensions on x86 and uses a
# portable software backend elsewhere, which is the right contract for release
# images that may be built on heterogeneous remote Docker hosts.
sha2 = { version = "0.10.8", features = ["oid"] }
syn = { version = "2.0.89" }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tailwind-merge = { package = "proa_tailwind_merge", path = "tailwind-merge/tailwind-merge", version = "0.1.2" }
tempfile = { version = "3" }
thiserror = { version = "2.0.17" }
tokio = { version = "1.34.0", features = ["full"] }
toml = { version = "0.8" }
tower = { version = "0.5.2" }
tower-http = { version = "0.6.6", features = ["full"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
trybuild = { version = "1" }
walkdir = { version = "2.4" }

# Register cfgs that proc macros in the workspace emit so check-cfg
# (enabled by default in modern Cargo) does not warn on legitimate
# uses. proa_macros still emits `#[cfg(rust_analyzer)]` IDE hints for
# expression slots in markdown/MDX macros.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package.proa_demo]
strip = true

# cargo-proa hashes every compiler artifact and source input with SHA-256 on
# each linked build. In a dev-profile `proa` binary (what CI runs through
# `cargo run -p proa-cli`) an unoptimized sha2 spent 20 to 30 seconds per
# invocation between the descriptor and final stages, so the hashing crates
# are always optimized. Everything else keeps the dev profile; `test`
# inherits these overrides.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3

[profile.dev.package."digest:0.10.7"]
opt-level = 3

[profile.dev.package."sha2:0.11.0"]
opt-level = 3

[profile.dev.package."digest:0.11.3"]
opt-level = 3

# proa_showcase pages are rendered by the playground in production
# benchmarks (vs Marko / React), so they DO need full optimization.
# Keeping the workspace defaults (opt-level = 3, codegen-units = 1).

# Optimized-ish dev profile for fast inner-loop iteration. Use when
# you want release-shaped behaviour (no debug assertions, optimized
# enough to feel fast in the browser) without paying the 2-minute
# full-release link cost on every rebuild.
#
#   cargo run --profile release-fast --bin proa-playground   # dev
#   cargo run --release --bin proa-playground                # benchmark
#
# `lto = false` + `codegen-units = 16` are the two settings that
# matter most for compile speed; both diverge from the strict
# release profile. Numbers produced under `release-fast` should NOT
# be cited externally — only the strict `release` profile gives
# defensible Marko / React comparison results.
[profile.release-fast]
inherits = "release"
opt-level = 1
codegen-units = 16
lto = false
strip = false
debug-assertions = false
overflow-checks = false
