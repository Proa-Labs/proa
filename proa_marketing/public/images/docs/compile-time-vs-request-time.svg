<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Compile time versus request time in Proa">
  <style>
    .panel { fill: none; stroke: #9aa3af; stroke-width: 1.5; rx: 10; }
    .panel-tint-a { fill: #6366f1; opacity: 0.06; }
    .panel-tint-b { fill: #10b981; opacity: 0.06; }
    .h { font: 600 17px ui-sans-serif, system-ui, sans-serif; fill: #6b7280; letter-spacing: 0.02em; }
    .t { font: 14px ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
    .m { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6b7280; }
    .accent-a { fill: #6366f1; }
    .accent-b { fill: #10b981; }
    .chip { fill: none; stroke: #9aa3af; stroke-width: 1.2; rx: 5; }
    .chip-static { fill: #6366f1; opacity: 0.14; }
    .chip-slot { fill: #10b981; opacity: 0.14; }
    .arrow { fill: none; stroke: #9aa3af; stroke-width: 1.6; }
    .once { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #6366f1; }
    .each { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #10b981; }
    @media (prefers-color-scheme: dark) {
      .h, .t, .m { fill: #a8b0bd; }
      .panel, .chip { stroke: #6b7280; }
    }
  </style>

  <rect class="panel-tint-a" x="24" y="52" width="392" height="300" rx="10"/>
  <rect class="panel" x="24" y="52" width="392" height="300"/>
  <text class="h" x="44" y="38">Compile time</text>
  <text class="once" x="44" y="80">RUNS ONCE, IN build.rs</text>

  <text class="m" x="44" y="118">html_sync! {</text>
  <text class="m" x="60" y="140">&lt;p class="price"&gt;</text>
  <text class="m" x="76" y="162">"$"{self.price}" / night"</text>
  <text class="m" x="60" y="184">&lt;/p&gt;</text>
  <text class="m" x="44" y="206">}</text>

  <path class="arrow" d="M220 222 L220 252" marker-end="url(#a)"/>
  <text class="t" x="236" y="244">macro expansion</text>

  <rect class="chip-static" x="44" y="266" width="150" height="30" rx="5"/>
  <rect class="chip" x="44" y="266" width="150" height="30"/>
  <text class="m" x="54" y="286">&lt;p class="price"&gt;$</text>

  <rect class="chip-slot" x="204" y="266" width="86" height="30" rx="5"/>
  <rect class="chip" x="204" y="266" width="86" height="30"/>
  <text class="m" x="214" y="286">{price}</text>

  <rect class="chip-static" x="300" y="266" width="98" height="30" rx="5"/>
  <rect class="chip" x="300" y="266" width="98" height="30"/>
  <text class="m" x="310" y="286"> / night&lt;/p&gt;</text>

  <text class="t" x="44" y="326">Two static byte runs and one slot,</text>
  <text class="t" x="44" y="344">baked into the binary.</text>

  <path class="arrow" d="M424 200 L462 200" marker-end="url(#a)"/>

  <rect class="panel-tint-b" x="470" y="52" width="386" height="300" rx="10"/>
  <rect class="panel" x="470" y="52" width="386" height="300"/>
  <text class="h" x="490" y="38">Request time</text>
  <text class="each" x="490" y="80">RUNS ON EVERY REQUEST</text>

  <rect class="chip-static" x="490" y="112" width="150" height="30" rx="5"/>
  <rect class="chip" x="490" y="112" width="150" height="30"/>
  <text class="m" x="500" y="132">copy bytes</text>

  <rect class="chip-slot" x="490" y="156" width="150" height="30" rx="5"/>
  <rect class="chip" x="490" y="156" width="150" height="30"/>
  <text class="m" x="500" y="176">format 1 integer</text>

  <rect class="chip-static" x="490" y="200" width="150" height="30" rx="5"/>
  <rect class="chip" x="490" y="200" width="150" height="30"/>
  <text class="m" x="500" y="220">copy bytes</text>

  <path class="arrow" d="M660 172 L700 172" marker-end="url(#a)"/>
  <text class="t" x="712" y="166">response</text>
  <text class="t" x="712" y="184">bytes</text>

  <text class="t" x="490" y="270">No intermediate String.</text>
  <text class="t" x="490" y="292">No virtual DOM walk.</text>
  <text class="t" x="490" y="314">No template parsing.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3af"/>
    </marker>
  </defs>
</svg>
