# cargo-audit configuration. Read automatically by `cargo audit`,
# including the `cargo audit --deny warnings` gate in
# .github/workflows/cargo-audit.yml.
#
# Process (per the workflow header comments): a false positive or
# accepted risk gets an ignore entry here (for cargo-audit) and in
# deny.toml [advisories].ignore (for cargo-deny), each with a
# justification and an acceptance date. Never loosen severity globally.
#
# Every entry below is an informational advisory (unmaintained or
# unsound) with no fixed release available. They enter through example apps,
# developer tooling, build-time processors, or dev-dependencies. Revisit each
# entry when its parent dependency updates.

[advisories]
ignore = [
    # bincode 1.3.3, unmaintained. Enters via syntect's dump loader in
    # proa_docs_build. Syntect deserializes only its crate-embedded syntax pack
    # from the selected release at docs build time; no untrusted bytes reach
    # bincode. Accepted.
    "RUSTSEC-2025-0141",
    # number_prefix 0.4.0, unmaintained. Enters only via indicatif
    # progress bars in the proa-cli developer tool. Dev-tooling
    # dependency path, not shipped library code. Accepted.
    "RUSTSEC-2025-0119",
    # rand 0.8.5 and 0.9.2, unsound only when a custom logger re-enters
    # rand::rng(); no fixed release exists. rand 0.8.5 remains in the lock via
    # SQLx's optional MySQL/Postgres drivers. rand 0.9.2 enters via proptest (a
    # dev-dependency of proa_core, test builds only) and via
    # reqwest -> quinn -> quinn-proto in proa_framework_axum, where the
    # narrow custom-logger unsoundness condition does not apply to a
    # server render path. Accepted.
    "RUSTSEC-2026-0097",
]
