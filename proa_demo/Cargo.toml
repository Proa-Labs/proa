[package]
name = "proa_demo"
version = "0.1.0"
edition.workspace = true
publish = false
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench_native"
path = "src/bench_native.rs"

[[bin]]
name = "proa-playground"
path = "src/playground.rs"
required-features = ["server"]

[features]
default = []
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:open", "dep:reqwest", "dep:flate2", "dep:sha2", "dep:brotli"]

[dependencies]
axum = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
futures = { workspace = true }
heapless = { workspace = true }
open = { version = "5", optional = true }
proa_core = { workspace = true }
proa_macros = { workspace = true }
proa_showcase = { workspace = true, features = ["rsjs-pages"] }
proa_stream = { workspace = true, features = ["rt-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
rsjs = { workspace = true }
rsjs_macros = { workspace = true }
seq-macro = { version = "0.3" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
