[package]
name = "proa_framework_axum"
version = "0.3.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Axum and Tokio adapter for Proa SSR applications."
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
route-export = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { version = "0.1", features = [
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
include_dir = { version = "0.7" }
mime = { version = "0.3" }
parking_lot = { version = "0.12" }
pin-project = { version = "1.1" }
proa_core = { workspace = true }
proa_framework_core = { workspace = true }
proa_macros = { workspace = true }
proa_react = { workspace = true }
proa_stream = { workspace = true, features = ["rt-tokio"] }
# CSP nonce generation: OS-seeded CSPRNG plus base64 encoding.
rand = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1" }
# `limit` for the builder's global concurrency cap, `util` for
# `ServiceExt` in tests and combinators.
tower = { workspace = true, features = ["limit", "util"] }
# Workspace declaration enables `full`, which covers the `timeout`,
# `catch-panic`, and `set-header` features the builder uses.
tower-http = { workspace = true }
tracing = { workspace = true }
url = { version = "2.5" }

[dev-dependencies]
http-body-util = { workspace = true }
rsjs = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
