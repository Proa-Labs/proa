# gha-runner-scale-set values for the Proa CI fleet on GKE (Standard mode,
# spot node pool with local NVMe ephemeral storage). The scale-set name IS
# the runs-on label: CI_RUNNER=gcp routes ci.yml here; CI_RUNNER=vps is the
# rollback path.
githubConfigUrl: https://github.com/Proa-Labs/proa
githubConfigSecret: proa-github-token
controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc-systems
runnerScaleSetName: gcp-ci
minRunners: 0
maxRunners: 8
template:
  spec:
    serviceAccountName: runner
    nodeSelector:
      ci-runner-pool: "true"
    tolerations:
      - key: ci-runner-pool
        operator: Equal
        value: "true"
        effect: NoSchedule
    containers:
      - name: runner
        image: us-west1-docker.pkg.dev/airy-cycle-504821-k9/ci-images/proa-runner:1.95.0-v5
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "7"
            memory: "26Gi"
            # emptyDir below lands on the node's local NVMe SSD
            # (--ephemeral-storage-local-ssd), so the work dir gets
            # NVMe latency with zero persistent-disk quota cost.
            ephemeral-storage: "80Gi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
    volumes:
      - name: work
        emptyDir: {}
