[package]
name = "mcp-incident-desk"
default-run = "mcp-incident-desk"
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[dependencies]
anyhow = "1"
axum = "0.7.9"
dotenvy = "0.15"
proa_core = { workspace = true }
proa_framework_axum = { workspace = true }
proa_macros = { workspace = true }
proa_stream = { workspace = true }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde_json = { version = "1" }
http = "1"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
rand = "0.8.6"
rsa = { version = "0.9", features = ["pem"] }
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
argon2 = "0.5"
url = { version = "2", features = ["serde"] }
urlencoding = "2"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = "0.23.46"
reqwest = { version = "0.13", features = ["json", "form", "cookies"] }
rmcp = { version = "=3.2.0", features = ["client", "server", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-io", "reqwest"] }
schemars = "1"
tiktoken-rs = "0.7"
const_format = { version = "0.2" }
heapless = { version = "0.8" }
proa_actions = { workspace = true }
proa_ir = { workspace = true }

[dev-dependencies]
pulldown-cmark = { workspace = true, features = ["html"] }
regex = "1"
tempfile = "3"

http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }


[lints]
workspace = true
