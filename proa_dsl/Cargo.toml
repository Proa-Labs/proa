[package]
name = "proa_dsl"
version = "0.2.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Shared parser + AST for proa's html! / html_sync! template macros. Library crate (not proc-macro) so multiple consumers (proa_macros itself, rsjs_macros, future tooling) can share one parser definition."
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["markdown"]
markdown = ["dep:comrak", "dep:pulldown-cmark"]
# Disable the compile-time perf-hint warnings in the consolidation
# validation pass (forwarded from proa_macros' feature of the same name).
no-perf-hints = []

[dependencies]
proc-macro-crate = { workspace = true }
proa_ir = { workspace = true }
proa_html_policy = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits"] }
comrak = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }

[dev-dependencies]
proptest = { version = "1.5" }
serde_json = { workspace = true }

[[test]]
name = "markdown_contexts"
required-features = ["markdown"]

[[test]]
name = "markdown_escaping"
required-features = ["markdown"]
