[package]
name = "proa_marketing"
version = "0.1.0"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "Proa marketing website"
license-file.workspace = true

[[bin]]
name = "proa_marketing"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
const_json = { package = "proa_const_json", path = "../const_json/const_json", version = "0.1.2" }
futures = { workspace = true }
proa_core = { workspace = true }
proa_demo = { workspace = true, features = ["server"] }
proa_docs = { workspace = true }
proa_macros = { workspace = true }
proa_third_party = { workspace = true, features = ["google-analytics"] }
proa_showcase_web = { workspace = true }
# json to read the GitHub release metadata, stream so an 11MB archive is
# forwarded to the client instead of buffered in memory.
reqwest = { workspace = true, features = ["json", "stream"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rsjs = { workspace = true }
rsjs_macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["compression-br", "compression-gzip", "cors", "fs", "set-header", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[build-dependencies]
proa_docs_build = { workspace = true }

[dev-dependencies]
tower-test = { package = "tower", version = "0.5", features = ["util"] }

[lints]
workspace = true
