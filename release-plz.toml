[workspace]
# Publishing is additionally constrained in package manifests:
# publish.workspace = true resolves to [workspace.package].publish = ["crates-io"].
# The local release wrapper targets crates-io. No Cargo publish workflow is enabled.
release = false
dependencies_update = false
git_release_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
pr_labels = ["release"]
publish = true
publish_allow_dirty = false
# Verify each packaged crate before publication. Package-boundary failures
# should be fixed in the owning crate instead of hidden by the release tool.
publish_no_verify = false
publish_timeout = "30m"
release_always = false
# Keep public API compatibility checks enabled for normal automated releases.
# The initial standalone 0.3.0 bootstrap is a documented manual release because
# the prior package history was coupled to sibling repositories.
semver_check = true

