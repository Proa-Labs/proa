[package]
name = "proa-request-perf"
version = "0.0.0"
edition = "2021"
[workspace]
[features]
bulk = []
[dependencies]
proa_core = {git="https://github.com/Proa-Labs/proa",branch="main"}
proa_macros = {git="https://github.com/Proa-Labs/proa",branch="main"}
proa_framework_axum = {git="https://github.com/Proa-Labs/proa",branch="main"}
axum = "=0.7.9"
tokio = {version="1",features=["rt","macros"]}
tower = {version="0.4",features=["util"]}
serde_json = "1"
sha2 = "0.10"
[profile.release]
opt-level=3
lto="thin"
codegen-units=1
