[package]
name = "proa_framework_axum"
version = "0.4.1"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Axum and Tokio adapter for Proa SSR applications."
license-file.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base16ct = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
cssparser = "0.38.0"
oxc_allocator = "0.160.0"
oxc_ast = "0.160.0"
oxc_ast_visit = "0.160.0"
oxc_codegen = "0.160.0"
oxc_minifier = "0.160.0"
oxc_parser = "0.160.0"
oxc_semantic = "0.160.0"
oxc_span = "0.160.0"
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", features = [
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
include_dir = { version = "0.7" }
mime = { version = "0.3" }
parking_lot = { version = "0.13.0" }
percent-encoding = "2"
pin-project = { version = "1.1" }
proa_assets = { workspace = true }
proa_core = { workspace = true }
proa_framework_core = { workspace = true }
proa_macros = { workspace = true }
rsjs = { workspace = true }
proa_stream = { workspace = true, features = ["rt-tokio"] }
# CSP nonce generation: OS-seeded CSPRNG plus base64 encoding.
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1" }
# `limit` for the builder's global concurrency cap, `util` for
# `ServiceExt` in tests and combinators.
tower = { workspace = true, features = ["limit", "util"] }
# Enable only the middleware used by the builder; avoid unrelated codecs.
tower-http = { workspace = true, features = ["catch-panic", "fs", "set-header", "timeout"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
proa_assets = { workspace = true, features = ["build"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tempfile = { workspace = true }
async-stream = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
