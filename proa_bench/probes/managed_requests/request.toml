[package]
name = "proa-request-perf"
version = "0.0.0"
edition = "2021"
[workspace]
[features]
bulk = []
[dependencies]
proa_core = "0.3.0"
proa_macros = "0.3.0"
proa_framework_axum = "0.3.0"
axum = "=0.7.9"
tokio = {version="1",features=["rt","macros"]}
tower = {version="0.4",features=["util"]}
serde_json = "1"
sha2 = "0.10"
[profile.release]
opt-level=3
lto="thin"
codegen-units=1
