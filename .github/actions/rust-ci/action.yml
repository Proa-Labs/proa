name: Rust CI
description: Run Rust formatting, correctness lints, tests, and RSJS conformance

inputs:
  cache-backend:
    description: Compiler cache backend, one of gha, gcs, or gcs-ro (GCS read-only, for untrusted pull-request runners)
    required: true

runs:
  using: composite
  steps:
    - name: Select affected Rust packages
      id: plan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 scripts/rust_ci.py plan --plan "$RUNNER_TEMP/rust-ci-plan.json"

    - name: Identify compiler cache compatibility
      id: compiler
      shell: bash
      run: echo "identity=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    # GitHub isolates PR cache writes from main. The default branch seeds a
    # readable baseline; trusted jobs cannot restore PR-scoped archives.
    # Keep complete Cargo artifacts, including nested UI/fixture targets.
    - name: Restore Rust build artifacts
      continue-on-error: true
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          target
          ~/.cargo/registry
          ~/.cargo/git
        key: rust-validation-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
        restore-keys: |
          rust-validation-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-

    - name: Restore unchanged source timestamps
      shell: bash
      run: |
        python3 scripts/rust_ci.py restore-mtimes --state target/.rust-ci-source-state.json
        rm -rf target/cargo-timings

    - name: Validate cache backend
      shell: bash
      env:
        CACHE_BACKEND: ${{ inputs.cache-backend }}
      run: |
        case "$CACHE_BACKEND" in
          gha|gcs|gcs-ro) ;;
          *)
            echo "unsupported sccache backend: $CACHE_BACKEND" >&2
            exit 1
            ;;
        esac

    - name: Install pinned sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.17.0

    - name: Enable GitHub Actions sccache
      if: inputs.cache-backend == 'gha'
      shell: bash
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GHA_ENABLED=on"
        } >> "$GITHUB_ENV"

    - name: Enable trusted GCS sccache
      if: inputs.cache-backend == 'gcs'
      shell: bash
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GCS_BUCKET=proa-ci-sccache"
          echo "SCCACHE_GCS_RW_MODE=READ_WRITE"
        } >> "$GITHUB_ENV"

    # Pull requests read the cache that trusted main runs populate but never
    # write to it: the PR pool's Workload Identity holds only objectViewer on
    # the bucket, and READ_ONLY keeps sccache from even attempting uploads.
    # Without this, each new PR's first run started from a cold cache because
    # the GitHub Actions cache is scoped per PR ref and main never writes it.
    - name: Enable read-only GCS sccache
      if: inputs.cache-backend == 'gcs-ro'
      shell: bash
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GCS_BUCKET=proa-ci-sccache"
          echo "SCCACHE_GCS_RW_MODE=READ_ONLY"
        } >> "$GITHUB_ENV"

    - name: lint (rustfmt)
      shell: bash
      run: cargo fmt --all -- --check

    - name: clippy
      shell: bash
      run: python3 scripts/rust_ci.py clippy --plan "$RUNNER_TEMP/rust-ci-plan.json"

    # Workspace/all-targets checks unify dev features. These normal library
    # graphs catch runtime features accidentally supplied only by tests.
    - name: Check independent library feature sets
      shell: bash
      run: python3 scripts/rust_ci.py features --plan "$RUNNER_TEMP/rust-ci-plan.json"

    - name: Check quickstart examples against the workspace CLI
      if: steps.plan.outputs.cli == 'true'
      shell: bash
      run: |
        cargo build --locked --timings -p proa-cli --bin proa
        python3 scripts/check_quickstart.py \
          --cli "${CARGO_TARGET_DIR:-target}/debug/proa" \
          --source-only --work-dir "$RUNNER_TEMP/quickstart-workspace"

    # render/head-role-required is the only enforcement of the async head-hook
    # role contract, so the source lint must run over production sources and
    # scaffolds, not just the quickstart. Error-severity diagnostics fail this
    # step; warnings do not. examples/mcp-incident-desk stays out until its
    # pre-existing render/content-coverage errors are fixed.
    - name: Lint workspace sources with the proa source linter
      if: steps.plan.outputs.cli == 'true'
      shell: bash
      run: |
        "${CARGO_TARGET_DIR:-target}/debug/proa" lint \
          proa_core/src \
          proa_stream/src \
          proa_framework/proa_framework_core/src \
          proa_framework/proa_framework_axum/src \
          proa_marketing/src \
          proa_cli/src/site_scaffold/templates \
          examples/webmcp-pizza

    - name: Check generated RSJS web bindings
      if: steps.plan.outputs.bindings == 'true'
      shell: bash
      run: cargo run --locked -p rsjs_web --bin rsjs-web-codegen -- --check

    - name: Install Node.js for JavaScript execution tests
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"
        check-latest: true

    - name: Test mounted RSJS query and mutation requests
      if: steps.plan.outputs.rsjs == 'true'
      shell: bash
      run: node rsjs/runtime/rsjs-runtime.base-path.test.mjs

    - name: Test Proa editor adapters and LSP transport
      if: steps.plan.outputs.cli-tests == 'true'
      shell: bash
      run: |
        corepack enable
        pnpm -C editors/lsp install --frozen-lockfile --ignore-scripts
        pnpm -C editors/vscode install --frozen-lockfile --ignore-scripts
        pnpm run editor:test
        PROA_TEST_LINT="$(realpath "${CARGO_TARGET_DIR:-target}/debug/proa")" pnpm -C editors/lsp test:lint

    # Clippy type-checks the same workspace/all-targets graph. The test steps
    # below then perform real codegen, so another cargo check adds no coverage.
    - name: test (libraries)
      shell: bash
      run: python3 scripts/rust_ci.py libraries --plan "$RUNNER_TEMP/rust-ci-plan.json"

    - name: test (integration)
      shell: bash
      run: python3 scripts/rust_ci.py integration --plan "$RUNNER_TEMP/rust-ci-plan.json"

    - name: Check the reviewed HTML and Markdown content pair
      if: steps.plan.outputs.cli-tests == 'true'
      shell: bash
      run: |
        cargo test --locked -p proa-cli --test content_coverage
        cargo run --locked -p proa-cli --bin proa -- lint proa_macros/tests/content_coverage.rs --include-tests \
          --deny render/content-coverage --deny render/content-coverage-unchecked \
          --deny render/content-omit-stale --deny render/content-omit-redundant \
          --deny render/content-omit-ambiguous --deny render/content-omit-unresolved --deny render/content-policy-invalid

    - name: Check RSJS conformance manifest and snapshots
      if: steps.plan.outputs.rsjs == 'true'
      shell: bash
      run: node rsjs_conformance/report.mjs --check

    - name: Check package publication policy
      shell: bash
      run: |
        python3 scripts/check_publish_policy.py

    - name: sccache stats
      if: always()
      shell: bash
      run: sccache --show-stats

    - name: Record source timestamps for the next build
      shell: bash
      run: python3 scripts/rust_ci.py save-mtimes --state target/.rust-ci-source-state.json

    - name: Upload Rust build timings
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: rust-validation-timings
        path: target/cargo-timings/*.html
        if-no-files-found: ignore
        retention-days: 7
